<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legit Earnings</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
.header{background:#0a7a3d;color:white;text-align:center;padding:25px}
.card{background:white;margin:15px;padding:20px;border-radius:15px}
button{padding:12px 18px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.green{background:#0a7a3d;color:white}
.red{background:#c00;color:white}
.gray{background:#eee}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
.task{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.hidden{display:none}
.userRow{border-bottom:1px solid #eee;padding:10px 0}
</style>
</head>
<body>
<div class="header"><h1>💰 Legit Earnings</h1><p>Earn by completing simple tasks</p></div>
<div id="authBox" class="card">
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email e.g lyash730@gmail.com">
<input id="password" type="password" placeholder="Password">
<button class="green" onclick="signup()">Sign Up</button>
<button class="gray" onclick="login()">Login</button>
</div>
<div id="userBox" class="card hidden">
<h2>Your Balance</h2><h1 id="balance">₦0</h1><p id="userEmail"></p>
<button class="red" id="adminBtn" onclick="showAdmin()" style="display:none">👑 ADMIN DASHBOARD</button>
<button class="gray" onclick="logout()">Logout</button>
<h2 style="margin-top:20px">Available Tasks</h2>
<div class="task"><span>Watch a YouTube video</span><button class="green" onclick="doTask(50)">Earn ₦50</button></div>
<div class="task"><span>Follow on Instagram</span><button class="green" onclick="doTask(100)">Earn ₦100</button></div>
<div class="task"><span>Share on WhatsApp</span><button class="green" onclick="doTask(80)">Earn ₦80</button></div>
<h2 style="margin-top:20px">Withdraw</h2>
<input id="withdrawAmt" type="number" placeholder="Amount e.g 500">
<input id="bankDetails" placeholder="Bank Name - Acct No - Acct Name">
<button class="green" onclick="requestWithdraw()">Request Withdrawal</button>
</div>
<div id="adminBox" class="card hidden" style="border:3px solid #c00">
<h2>👑 ADMIN DASHBOARD</h2><p>Only you can see this.</p>
<button class="gray" onclick="hideAdmin()">⬅ Back to User View</button>
<h3>All Users</h3><div id="allUsers"></div>
<h3>Withdrawal Requests</h3><div id="allWithdraws"></div>
<button class="red" onclick="clearAll()">Clear All Data</button>
</div>
<script>
let ADMIN_EMAIL="lyash730@gmail.com";
let users=JSON.parse(localStorage.getItem("le_users")||"{}");
let withdraws=JSON.parse(localStorage.getItem("le_withdraws")||"[]");
let current=localStorage.getItem("le_current")||"";
function save(){localStorage.setItem("le_users",JSON.stringify(users));localStorage.setItem("le_withdraws",JSON.stringify(withdraws));}
function signup(){let e=document.getElementById("email").value.trim().toLowerCase();let p=document.getElementById("password").value;if(!e||!p)return alert("Enter email and password");if(users[e])return alert("Account exists, Login");users[e]={password:p,balance:0};save();current=e;localStorage.setItem("le_current",e);show();}
function login(){let e=document.getElementById("email").value.trim().toLowerCase();let p=document.getElementById("password").value;if(users[e]&&users[e].password===p){current=e;localStorage.setItem("le_current",e);show();}else alert("Wrong email or password");}
function logout(){localStorage.removeItem("le_current");current="";show();}
function doTask(amt){users[current].balance+=amt;save();show();alert("You earned ₦"+amt);}
function requestWithdraw(){let amt=parseInt(document.getElementById("withdrawAmt").value);let bank=document.getElementById("bankDetails").value;if(!amt||!bank)return alert("Enter amount and bank details");if(amt>users[current].balance)return alert("Not enough balance");users[current].balance-=amt;withdraws.push({email:current,amount:amt,bank:bank,status:"Pending",date:new Date().toLocaleString()});save();show();alert("Withdrawal requested!");}
function show(){if(current&&users[current]){document.getElementById("authBox").classList.add("hidden");document.getElementById("userBox").classList.remove("hidden");document.getElementById("balance").innerText="₦"+users[current].balance;document.getElementById("userEmail").innerText=current;if(current===ADMIN_EMAIL)document.getElementById("adminBtn").style.display="block";else document.getElementById("adminBtn").style.display="none";}else{document.getElementById("authBox").classList.remove("hidden");document.getElementById("userBox").classList.add("hidden");document.getElementById("adminBox").classList.add("hidden");}}
function showAdmin(){document.getElementById("adminBox").classList.remove("hidden");let html="";for(let em in users){html+=`<div class="userRow"><b>${em}</b> - Balance: ₦${users[em].balance}</div>`;}if(!html)html="No users yet";document.getElementById("allUsers").innerHTML=html;let whtml="";withdraws.forEach((w,i)=>{whtml+=`<div class="userRow"><b>${w.email}</b> wants ₦${w.amount}<br>${w.bank}<br>Status: ${w.status} - ${w.date}<br><button class="green" onclick="approve(${i})">Approve</button> <button class="red" onclick="reject(${i})">Reject</button></div>`;});if(!whtml)whtml="No withdrawal requests yet";document.getElementById("allWithdraws").innerHTML=whtml;window.scrollTo(0,0);}
function hideAdmin(){document.getElementById("adminBox").classList.add("hidden");}
function approve(i){withdraws[i].status="Approved";save();showAdmin();alert("Approved!");}
function reject(i){let w=withdraws[i];if(w.status==="Pending"&&users[w.email])users[w.email].balance+=w.amount;withdraws[i].status="Rejected";save();showAdmin();alert("Rejected and refunded");}
function clearAll(){if(confirm("Delete all users?")){localStorage.clear();location.reload();}}
show();
</script>
</body>
</html>
